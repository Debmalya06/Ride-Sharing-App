name: Build, Push & Deploy SmartRide

on:
  push:
    branches: ["DebmalyaPan"]
  pull_request:
    branches: ["DebmalyaPan"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build Spring Boot JAR
        working-directory: Ride-Sharing
        run: mvn -B clean package -DskipTests

      - name: Build & Push Docker Image
        if: github.event_name == 'push'
        uses: mr-smithers-excellent/docker-build-push@v5
        with:
          context: .
          dockerfile: Ride-Sharing/Dockerfile
          image: debmalya06/ride-sharing-app
          tags: latest,${{ github.sha }}
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Azure Login
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        if: github.event_name == 'push'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ca-smartride-api \
              --resource-group rg-smartride-prod \
              --image docker.io/debmalya06/ride-sharing-app:${{ github.sha }}
